version: 2.1

orbs:
  aws_assume_role: lbh-hackit/aws_assume_role@0.1.0
  sonarcloud: sonarsource/sonarcloud@2.0.0  

executors:
  docker-python:
    docker:
      - image: circleci/python:3.7
  docker-terraform:
    docker:
      - image: "hashicorp/terraform:light"
  docker-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:8.0

references:
  workspace_root: &workspace_root "~"
  attach_workspace: &attach_workspace
    attach_workspace:
      at: *workspace_root

commands:
  assume-role-and-persist-workspace:
    description: "Assumes deployment role and persists credentials across jobs"
    parameters:
      aws-account:
        type: string
    steps:
      - checkout
      - aws_assume_role/assume_role:
          account: <<parameters.aws-account>>
          profile_name: default
          role: "LBH_Circle_CI_Deployment_Role"
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws

  terraform-init-then-plan:
    description: "Initializes and run plan from terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform get -update=true
            terraform init
          name: get and init
      - run:
          name: plan
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform plan -out=plan.out
      - persist_to_workspace:
          root: *workspace_root
          paths:
            - .aws
            - project/*

  terraform-apply:
    description: "Applies terraform configuration"
    parameters:
      environment:
        type: string
    steps:
      - *attach_workspace
      - checkout
      - run:
          name: apply
          command: |
            cd ./terraform/<<parameters.environment>>/
            terraform apply -auto-approve plan.out

  deploy-lambda:
    description: "Deploys API via Serverless"
    parameters:
      stage:
        type: enum
        enum: ['development', 'staging', 'production']
      aws-central-parameter-account:
        type: enum
        enum:
          [
            'AWS_ACCOUNT_DEVELOPMENT',
            'AWS_ACCOUNT_STAGING',
            'AWS_ACCOUNT_PRODUCTION',
          ]
    steps:
      - *attach_workspace
      - checkout
      # - setup_remote_docker
      - run:
          name: Install Node
          command: |
            apt-get update
            apt-get install -y curl ca-certificates
            curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
            apt-get install -y nodejs
      - run:
          name: Install AWS CLI
          command: |
            apt-get update
            apt-get install -y awscli
      - run:
          name: Fetch SSM parameters from central account for serverless deployment
          command: |
            CENTRAL_ACCOUNT=${<<parameters.aws-central-parameter-account>>}
            export EVIDENCE_API=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/mtfh-housing-<<parameters.stage>>/mtfh-housing/evidence-api-url \
              --query Parameter.Value \
              --output text)            
            export ACTIVITY_HISTORY_API=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/mtfh-housing-<<parameters.stage>>/mtfh-housing/activity-history-api-url \
              --query Parameter.Value \
              --output text)
            export SEARCH_DOMAIN=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/search-domain \
              --query Parameter.Value \
              --output text)
            export NOTIFY_TEMPLATE_BEDROOM_CHANGE=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/notify-template-bedroom-change \
              --query Parameter.Value \
              --output text)
            export EVIDENCE_API_REQUESTED_BY=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/evidence-api-requested-by-email \
              --query Parameter.Value \
              --output text)
            export NOVALET_FTP_USERNAME=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/novalet-ftp-username \
              --query Parameter.Value \
              --output text)
            export NOVALET_FTP_ADDRESS=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/novalet-ftp-address \
              --query Parameter.Value \
              --output text)
            export NOVALET_FTP_PORT=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/novalet-ftp-port \
              --query Parameter.Value \
              --output text)
            export NOVALET_FTP_FOLDER=$(aws ssm get-parameter \
              --name arn:aws:ssm:eu-west-2:${CENTRAL_ACCOUNT}:parameter/housing-<<parameters.stage>>/housing-register-<<parameters.stage>>/housing-register/novalet-ftp-folder \
              --query Parameter.Value \
              --output text)
              
            echo "export EVIDENCE_API=${EVIDENCE_API}" >> $BASH_ENV
            echo "export ACTIVITY_HISTORY_API=${ACTIVITY_HISTORY_API}" >> $BASH_ENV
            echo "export SEARCH_DOMAIN=${SEARCH_DOMAIN}" >> $BASH_ENV
            echo "export NOTIFY_TEMPLATE_BEDROOM_CHANGE=${NOTIFY_TEMPLATE_BEDROOM_CHANGE}" >> $BASH_ENV
            echo "export EVIDENCE_API_REQUESTED_BY=${EVIDENCE_API_REQUESTED_BY}" >> $BASH_ENV
            echo "export NOVALET_FTP_USERNAME=${NOVALET_FTP_USERNAME}" >> $BASH_ENV
            echo "export NOVALET_FTP_ADDRESS=${NOVALET_FTP_ADDRESS}" >> $BASH_ENV
            echo "export NOVALET_FTP_PORT=${NOVALET_FTP_PORT}" >> $BASH_ENV
            echo "export NOVALET_FTP_FOLDER=${NOVALET_FTP_FOLDER}" >> $BASH_ENV 
            echo "export NEXT_PUBLIC_GTM_ID=${NEXT_PUBLIC_GTM_ID}" >> $BASH_ENV      

      - run:
          name: Build and deploy lambda
          command: |
            set -e
            cd ./HousingRegisterApi/
            chmod +x ./build.sh
            ./build.sh

            npx --yes serverless@4 deploy \
              --stage <<parameters.stage>> \
              --param="evidenceApi=${EVIDENCE_API}" \
              --param="activityHistoryApi=${ACTIVITY_HISTORY_API}" \
              --param="searchDomain=${SEARCH_DOMAIN}" \
              --param="notifyTemplateBedroomChange=${NOTIFY_TEMPLATE_BEDROOM_CHANGE}" \
              --param="evidenceApiRequestedBy=${EVIDENCE_API_REQUESTED_BY}" \
              --param="novaletFtpUsername=${NOVALET_FTP_USERNAME}" \
              --param="novaletFtpAddress=${NOVALET_FTP_ADDRESS}" \
              --param="novaletFtpPort=${NOVALET_FTP_PORT}" \
              --param="novaletFtpFolder=${NOVALET_FTP_FOLDER}" \
              --param="gtmId=${NEXT_PUBLIC_GTM_ID}" \
              --conceal

jobs:
  check-code-formatting:
    executor: docker-dotnet
    steps:
      - checkout
      - run:
          name: Install dotnet format
          command: dotnet tool install dotnet-format --tool-path ./dotnet-format-local/
      - run:
          name: Run formatter check
          command: ./dotnet-format-local/dotnet-format --check
  build-and-test:
    executor: docker-python
    steps:
      - checkout:
          method: full
      - setup_remote_docker
      - run:
          name: build
          command: docker-compose build housing-register-api-test
      - run:
          name: Run tests
          command: docker-compose run housing-register-api-test
      - run:
          name: Report
          command: |
            mkdir -p coverage test_results
            CID=$(docker ps -aqf "name=housing-register-api-test" | head -n1)
            if [ -z "${CID}" ]; then
              echo "No test container found matching name=housing-register-api-test"
              exit 1
            fi
            docker cp "${CID}:/app/coverage/." ./coverage/
            docker cp "${CID}:/app/test_results/." ./test_results/
            find coverage -name '*.opencover.xml' -exec sed -i "s|/app/|$(pwd)/|g" {} +
      - store_test_results:
          path: test_results          
      - sonarcloud/scan          
  assume-role-development:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_DEVELOPMENT

  assume-role-staging:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_STAGING

  assume-role-production:
    executor: docker-python
    steps:
      - assume-role-and-persist-workspace:
          aws-account: $AWS_ACCOUNT_PRODUCTION

  terraform-init-and-plan-development:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "development"

  terraform-apply-development:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "development"

  terraform-init-and-plan-staging:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "staging"

  terraform-apply-staging:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "staging"

  terraform-init-and-plan-production:
    executor: docker-terraform
    steps:
      - terraform-init-then-plan:
          environment: "production"

  terraform-apply-production:
    executor: docker-terraform
    steps:
      - terraform-apply:
          environment: "production"

  deploy-to-development:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: 'development'
          aws-central-parameter-account: 'AWS_ACCOUNT_DEVELOPMENT'
  deploy-to-staging:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: 'staging'
          aws-central-parameter-account: 'AWS_ACCOUNT_STAGING'
  deploy-to-production:
    executor: docker-dotnet
    steps:
      - deploy-lambda:
          stage: 'production'
          aws-central-parameter-account: 'AWS_ACCOUNT_PRODUCTION'

workflows:
  check-and-deploy-development:
    jobs:
      - check-code-formatting:
          context: api-nuget-token-context
      - build-and-test:
          context: 
            - api-nuget-token-context
            - SonarCloud
      - assume-role-development:
          context: api-assume-role-housing-development-context
          requires:
            - build-and-test
            - check-code-formatting
          filters:
            branches:
              only: build/use-central-params
      - deploy-to-development:
          context:
            - api-nuget-token-context
            - Serverless Framework
            - central-parameter-store-context            
          requires:
            - assume-role-development
          filters:
            branches:
              only: build/use-central-params      

  check-and-deploy-staging-and-production:
    jobs:
      - build-and-test:
          context: 
            - api-nuget-token-context
            - SonarCloud
          filters:
            branches:
              only: master
      - assume-role-staging:
          context: api-assume-role-housing-staging-context
          requires:
            - build-and-test
          filters:
            branches:
              only: master
      - deploy-to-staging:
          context:
            - api-nuget-token-context
            - Serverless Framework        
            - central-parameter-store-context            
          requires:
            - assume-role-staging
          filters:
            branches:
              only: master
      - permit-production-workflow:
          type: approval
          requires:
            - deploy-to-staging
          filters:
            branches:
              only: master
      - assume-role-production:
          context: api-assume-role-housing-production-context
          requires:
            - permit-production-workflow
          filters:
            branches:
              only: master
      - permit-production-release:
          type: approval
          requires:
            - assume-role-production
          filters:
            branches:
              only: master
      - deploy-to-production:
          context:
            - api-nuget-token-context
            - Serverless Framework
            - central-parameter-store-context            
          requires:
            - permit-production-release
          filters:
            branches:
              only: master
     

  deploy-development-terraform:
    jobs:
      - permit-development-terraform-workflow:
            type: approval
            filters:
              branches:
                only: development
      - assume-role-development:
          context: api-assume-role-housing-development-context
          requires:
            - permit-development-terraform-workflow
          filters:
            branches:
              only: development
      - terraform-init-and-plan-development:
          requires:
            - assume-role-development
          filters:
            branches:
              only: development
      - permit-development-terraform-release:
          type: approval
          requires:
            - terraform-init-and-plan-development
          filters:
            branches:
              only: development
      - terraform-apply-development:
          requires:
            - permit-development-terraform-release
          filters:
            branches:
              only: development
  
  deploy-staging-and-production-terraform:
    jobs:
      - permit-staging-and-production-terraform-workflow:
          type: approval
          filters:
            branches:
              only: master
      - assume-role-staging:
          context: api-assume-role-housing-staging-context
          requires:
            - permit-staging-and-production-terraform-workflow
          filters:
            branches:
              only: master
      - terraform-init-and-plan-staging:
          requires:
            - assume-role-staging
          filters:
            branches:
              only: master
      - permit-staging-terraform-release:
          type: approval
          requires:
            - terraform-init-and-plan-staging
          filters:
            branches:
              only: master
      - terraform-apply-staging:
          requires:
            - permit-staging-terraform-release
          filters:
            branches:
              only: master
      - permit-production-terraform-workflow:
          type: approval
          filters:
            branches:
              only: master
          requires:
            - terraform-apply-staging
      - assume-role-production:
          context: api-assume-role-housing-production-context
          requires:
            - permit-production-terraform-workflow
          filters:
            branches:
              only: master
      - terraform-init-and-plan-production:
          requires:
            - assume-role-production
          filters:
            branches:
              only: master  
      - permit-production-terraform-release:
          type: approval
          requires:
            -  terraform-init-and-plan-production
          filters:
            branches:
              only: master
      - terraform-apply-production:
          requires:
            -  permit-production-terraform-release
          filters:
            branches:
              only: master
              